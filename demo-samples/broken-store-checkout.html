<!DOCTYPE html>
<html>
<head>
  <title>Apex Store - Wireless Headphones Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header>
    <img src="/images/apex-store-logo.svg">
    <nav>
      <a href="/catalog">All Products</a>
      <a href="/cart"></a>
    </nav>
  </header>

  <main>
    <section class="product-summary">
      <img src="https://images.unsplash.com/photo-wireless-headphone.jpg">
      <h2>Studio Pro Noise-Cancelling Headphones</h2>
      <p class="price">$199.99</p>

      <h1>Customer Shipping & Payment</h1>
      <h4>Express Delivery Address</h4>

      <form class="checkout-form">
        <input type="text" name="customer_name" placeholder="Full Name">
        <input type="email" name="customer_email" placeholder="Email Address">
        <input type="text" name="delivery_address" placeholder="Street Address">
        <input type="text" name="credit_card" placeholder="Card Number (16-digits)">
        
        <button type="submit" class="pay-btn"></button>
      </form>
    </section>
  </main>
</body>
</html>
